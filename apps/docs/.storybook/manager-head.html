<style>
  /* Overwrite storybook styles */
  body {
    margin: 0;
  }

  div.sidebar-header {
    display: none;
  }

  button[data-nodetype='group'] svg {
    display: none;
  }

  a[id$='docs'] svg {
    display: none;
  }

  #storybook-explorer-menu {
    margin-left: 1rem;
    margin-right: 1rem;
  }

  button[data-nodetype='group'] {
    font-weight: bold;
  }

  div[data-selected],
  button[data-nodetype='group']:hover {
    border-radius: 0.25rem;
  }

  #storybook-explorer-tree div[data-selected='true']:hover {
    background-color: color-mix(in hsl, #34d399, black 10%);
  }

  /* Header Styles */

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    width: 100%;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid rgba(24, 24, 27, 0.08);
    box-shadow: 0 1px 2px rgba(24, 24, 27, 0.04);
  }

  html[data-plume-mode='dark'] header {
    background: rgba(24, 24, 27, 0.72);
    border-bottom-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  header .container {
    align-items: center;
    display: flex;
    gap: 0.5rem;
    height: 3.5rem;
    justify-content: space-between;
    margin-inline: 1.25rem;
  }

  .header-start {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-links {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }

  /* Icon controls: muted foreground, brand-green on hover. */
  .header-links a,
  .plume-theme-toggle,
  .plume-nav-toggle {
    color: #52525b;
    transition: color 0.15s ease;
  }

  html[data-plume-mode='dark'] .header-links a,
  html[data-plume-mode='dark'] .plume-theme-toggle,
  html[data-plume-mode='dark'] .plume-nav-toggle {
    color: #a1a1aa;
  }

  .header-links a:hover,
  .plume-theme-toggle:hover,
  .plume-nav-toggle:hover {
    color: #34d399;
  }

  .header-links svg {
    width: 1.35rem;
    height: 1.35rem;
    fill: currentColor;
  }

  .plume-theme-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .plume-theme-toggle svg {
    display: block;
  }

  .plume-nav-toggle {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1.5rem;
    line-height: 1;
    padding: 0;
    display: flex;
    align-items: center;
  }

  /* The sidebar is persistent on wide screens, so only offer the toggle on small ones. */
  @media (min-width: 768px) {
    .plume-nav-toggle {
      display: none;
    }
  }

  .brand {
    display: block;
    width: 1.75rem;
    height: 1.75rem;
  }

  .title {
    color: #18181b;
    font-weight: 600;
    margin: 0;
    font-size: 1rem;
    line-height: 1.5rem;
    letter-spacing: -0.01em;
  }

  html[data-plume-mode='dark'] .title {
    color: #fafafa;
  }

  .title a {
    gap: 0.6rem;
  }

  a {
    text-decoration: none;
    color: inherit;
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
