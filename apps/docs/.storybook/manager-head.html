<script>
  // Same for the manager: set the mode and the dark canvas before the first paint.
  try {
    var mode = localStorage.getItem('plume-colormode')
    if (mode !== 'dark' && mode !== 'light') {
      mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    document.documentElement.setAttribute('data-plume-mode', mode)
    document.documentElement.style.colorScheme = mode
  } catch (error) {}
</script>
<style>
  html[data-plume-mode='dark'] body {

  /* Overwrite storybook styles */
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* Storybook sizes its layout to the full viewport; shrink it to the space below the
     custom header so the mobile bottom bar (navigation menu) stays on screen. */
  #root {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }

  #root > div {
    height: 100% !important;
  }

  div.sidebar-header {
    display: none;
  }

  /* Hide the preview toolbar (grid/background/outline/fullscreen) on every page;

  main .sb-bar {
    display: none;
  }

  /* Mobile bottom bar: the header hamburger already opens the navigation drawer. */
  .sb-bar[aria-label='Mobile navigation controls'] {
    display: none;
  }

  button[data-nodetype='group'] svg {
    display: none;
  }

  a[id$='docs'] svg {
    display: none;
  }

  /* The search box only reacts on focus by default: hint that it is interactive. */
  #storybook-explorer-searchfield {

  }

  #storybook-explorer-searchfield:hover,

  #storybook-explorer-menu {

    margin-right: 1rem;
  }

  button[data-nodetype='group'] {
    font-weight: bold;
  }

  div[data-selected],
  button[data-nodetype='group']:hover {
    border-radius: 0.25rem;
  }

  #storybook-explorer-tree div[data-selected='true']:hover {
    background-color: color-mix(in hsl, #34d399, black 10%);

  /* Header Styles */

  header {

    width: 100%;
    background: rgba(255, 255, 255, 0.72);

    border-bottom: 1px solid rgba(24, 24, 27, 0.08);
    box-shadow: 0 1px 2px rgba(24, 24, 27, 0.04);
  }

  html[data-plume-mode='dark'] header {

    border-bottom-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);

  header .container {

    display: flex;

    justify-content: space-between;
    margin-inline: 1.25rem;

  .header-start {

    align-items: center;
    gap: 0.75rem;
  }

  .header-links {
    display: flex;
    align-items: center;
    gap: 1.1rem;
  }

  @media (max-width: 479px) {
    .header-links {
      gap: 0.5rem;
    }
  }

  /* There is no room for the version next to the title and the icons. */
  @media (max-width: 359px) {
    .header-links .plume-version-menu {
      display: none;
    }
  }

    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
  }

    font-size: 1.5rem;

    padding: 0;

    align-items: center;

  /* The version the docs describe: a badge, or a menu once there are archived versions. */
  .plume-version-menu {
    align-items: center;
    display: flex;
    position: relative;
  }

  .plume-version {
    align-items: center;
    background: transparent;
    border: 1px solid rgba(24, 24, 27, 0.16);

    font: inherit;

    gap: 0.35rem;
    line-height: 1;
    padding: 0.3rem 0.6rem;
    white-space: nowrap;
  }

  button.plume-version {
    cursor: pointer;
    transition:
      border-color 0.15s ease,
      color 0.15s ease;
  }

  button.plume-version:hover,
  button.plume-version[aria-expanded='true'] {
    border-color: #34d399;
    color: #34d399;
  }

  button.plume-version:focus-visible,
  .plume-version-list a:focus-visible {
    outline: 2px solid #34d399;
    outline-offset: 2px;
  }

  .header-links .plume-version svg {
    fill: none;
    height: 0.75rem;
    transition: transform 0.15s ease;
    width: 0.75rem;
  }

  button.plume-version[aria-expanded='true'] svg {
    transform: rotate(180deg);
  }

  .plume-version-list {
    background: #fff;
    border: 1px solid rgba(24, 24, 27, 0.1);
    border-radius: 0.6rem;
    box-shadow: 0 8px 24px rgba(24, 24, 27, 0.12);
    inset-block-start: calc(100% + 0.5rem);
    inset-inline-end: 0;
    list-style: none;
    margin: 0;
    min-width: 100%;
    padding: 0.25rem;
    position: absolute;
    z-index: 20;
  }

  .plume-version-list[hidden] {
    display: none;
  }

  .header-links .plume-version-list a {
    border-radius: 0.4rem;
    color: #3f3f46;
    display: block;
    font-size: 0.8125rem;
    justify-content: flex-start;
    padding: 0.4rem 0.65rem;
    white-space: nowrap;
  }

  .header-links .plume-version-list a:hover {
    background: rgba(52, 211, 153, 0.14);
    color: #047857;
  }

  .header-links .plume-version-list a[aria-current='true'] {
    color: #059669;
    font-weight: 600;
  }

  html[data-plume-mode='dark'] .plume-version {
    border-color: rgba(255, 255, 255, 0.18);
    color: #a1a1aa;
  }

  html[data-plume-mode='dark'] button.plume-version:hover,
  html[data-plume-mode='dark'] button.plume-version[aria-expanded='true'] {
    border-color: #34d399;
    color: #34d399;
  }

  html[data-plume-mode='dark'] .plume-version-list {
    background: #27272a;
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }

  html[data-plume-mode='dark'] .header-links .plume-version-list a {
    color: #d4d4d8;
  }

  html[data-plume-mode='dark'] .header-links .plume-version-list a:hover {
    background: rgba(52, 211, 153, 0.16);
    color: #34d399;
  }

  html[data-plume-mode='dark'] .header-links .plume-version-list a[aria-current='true'] {
    color: #34d399;
  }

  .title a {
    gap: 0.5rem;
  }

  header a {
    text-decoration: none;
    color: inherit;
    display: flex;
    justify-content: center;
    align-items: center;
  }
</style>
