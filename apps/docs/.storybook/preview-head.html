<style>
  /* The boxes that center an example are flex items that can't shrink below their content,
     so on a narrow screen a width such as `36rem; max-width: 100%` overflows and is cut. */
  .docs-story > div > div,
  .sb-main-centered #storybook-root {
    max-width: 100%;
    min-width: 0;
  }

  /* The identity transform of the zoom box makes it the containing block of the fixed popups, which
     would open far from their trigger. */
  .docs-story > div > div {
    transform: none !important;
  }

  /* Bootstrap paints kbd as a tall inline box that runs into the lines around it and touches its
     neighbours, so the keys in the descriptions get their own box, like the inline code. */
  .sbdocs kbd {
    display: inline-block;
    margin: 0 0.15em;
    padding: 0.1em 0.45em;
    border: 1px solid #d4d4d8;
    border-bottom-width: 2px;
    border-radius: 0.3em;
    background-color: #f4f4f5;
    color: #27272a;
    font-size: 0.85em;
    font-weight: 500;
    line-height: 1.3;
    vertical-align: baseline;
    white-space: nowrap;
  }

  html[data-plume-color-mode='dark'] .sbdocs kbd {
    border-color: #52525b;
    background-color: #3f3f46;
    color: #f4f4f5;
  }

  /* Dark-mode overrides for Storybook docs blocks that the DocsContainer theme
     prop leaves white, plus the body text color Bootstrap forces to #212529. */
  html[data-plume-color-mode='dark'] body {
    background-color: #18181b;
    color: #e4e4e7;
  }

  html[data-plume-color-mode='dark'] .sb-previewBlock,

</style>
