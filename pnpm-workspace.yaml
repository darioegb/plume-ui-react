packages:
  - "apps/*"
  - "examples/*"
  # Standalone consumption examples: resolve @plume-ui-react/* from npm, not the workspace.
  - "!examples/vite-playground"
  - "!examples/next-app"
  - "!examples/next-pages"
  - "packages/*"
  - "packages/*/*"

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
